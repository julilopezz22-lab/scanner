<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#0A0A0F" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="CrossList" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icon.svg" />
<link rel="icon" href="icon.svg" />
<title>CrossList — Publicá en todos lados</title>
<style>
  :root{
    --bg:#0A0A0F; --panel:#16162A; --panel2:#111120; --line:#2A2A4A;
    --txt:#E8E8FF; --mut:#8888AA; --mut2:#6B6B9B; --pri:#5B8CFF; --pri2:#3D5AFE;
    --ok:#00C853; --warn:#FF9100; --bad:#FF4444; --gold:#FFC04D;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--bg);color:var(--txt);font-family:'Inter','Segoe UI',system-ui,sans-serif}
  body{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:84px}
  a{color:var(--pri)}
  .header{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:16px;
    padding-top:max(16px,env(safe-area-inset-top));background:linear-gradient(135deg,#1A1A2E,#0D0D1A);
    border-bottom:1px solid #1E1E35}
  .header .logo{font-size:24px}
  .h1{font-size:18px;font-weight:800;color:#E8E8FF;letter-spacing:.2px}
  .h2{font-size:10px;color:var(--mut2);text-transform:uppercase;letter-spacing:.6px}
  .grow{flex:1}
  .body{padding:14px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;border:none;
    border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
  .btn-pri{background:linear-gradient(135deg,var(--pri2),var(--pri));color:#fff}
  .btn-sec{background:var(--panel);border:1px solid var(--line);color:#A8A8D0}
  .btn-ghost{background:transparent;border:1px solid var(--line);color:var(--mut)}
  .btn-sm{padding:9px 12px;font-size:13px;border-radius:9px;width:auto}
  .iconbtn{width:38px;height:38px;border-radius:10px;background:var(--panel);border:1px solid var(--line);
    color:var(--txt);font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto}
  label{display:block;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;margin:14px 0 6px}
  input,select,textarea{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:11px;
    padding:12px 14px;color:var(--txt);font-size:15px;outline:none;font-family:inherit}
  input:focus,select:focus,textarea:focus{border-color:var(--pri)}
  textarea{min-height:96px;resize:vertical;line-height:1.5}
  select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%238888AA' stroke-width='2'><path d='M6 9l6 6 6-6'/></svg>");
    background-repeat:no-repeat;background-position:right 12px center;padding-right:36px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .field-half label{margin-top:0}
  .muted{color:var(--mut)}
  .pill{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:600}

  /* ---- Listado ---- */
  .toolbar{display:flex;gap:8px;align-items:center;margin-bottom:12px}
  .search{flex:1}
  .item{display:flex;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:11px;margin-bottom:10px;cursor:pointer;position:relative;overflow:hidden}
  .item:active{border-color:var(--pri)}
  .item .ph{width:72px;height:72px;border-radius:10px;object-fit:cover;background:var(--panel2);flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;font-size:26px;color:#444466}
  .item .info{flex:1;min-width:0}
  .item .it-title{font-size:14px;font-weight:700;line-height:1.3;margin-bottom:3px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .item .it-price{font-size:15px;font-weight:800;color:var(--ok)}
  .item .it-sub{font-size:11px;color:var(--mut);margin:2px 0 6px}
  .chips{display:flex;flex-wrap:wrap;gap:4px}
  .chip{font-size:9px;font-weight:700;padding:3px 6px;border-radius:6px;text-transform:uppercase;letter-spacing:.3px}
  .empty{text-align:center;padding:60px 20px;color:var(--mut2)}
  .empty .big{font-size:52px;margin-bottom:14px;opacity:.7}

  /* ---- Tabs nav ---- */
  .nav{position:fixed;bottom:0;left:0;right:0;z-index:40;display:flex;max-width:520px;margin:0 auto;
    background:#0D0D1A;border-top:1px solid #1E1E35;padding-bottom:env(safe-area-inset-bottom)}
  .nav button{flex:1;background:none;border:none;color:var(--mut2);padding:10px 4px 12px;font-size:10px;
    font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:inherit}
  .nav button .ic{font-size:20px}
  .nav button.on{color:var(--pri)}

  /* ---- Detalle / crosslist ---- */
  .gallery{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px}
  .gallery img{width:104px;height:104px;border-radius:12px;object-fit:cover;flex:0 0 auto;border:1px solid var(--line)}
  .gallery .add{width:104px;height:104px;border-radius:12px;border:1px dashed var(--line);background:var(--panel2);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--mut);
    font-size:12px;flex:0 0 auto;cursor:pointer}
  .photo-wrap{position:relative;flex:0 0 auto}
  .photo-wrap .del{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;
    background:#000a;border:none;color:#fff;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .photo-wrap .lead{position:absolute;bottom:4px;left:4px;font-size:8px;font-weight:800;background:var(--pri);
    color:#fff;padding:2px 5px;border-radius:5px;text-transform:uppercase}

  .mk{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden}
  .mk-head{display:flex;align-items:center;gap:10px;padding:13px 14px;cursor:pointer}
  .mk-ic{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;
    font-size:15px;font-weight:800;color:#fff;flex:0 0 auto}
  .mk-name{font-size:14px;font-weight:700;flex:1}
  .mk-meta{font-size:10px;color:var(--mut)}
  .mk-body{padding:0 14px 14px;display:none}
  .mk.open .mk-body{display:block}
  .mk.open .mk-head .caret{transform:rotate(180deg)}
  .caret{transition:transform .2s;color:var(--mut)}
  .out-block{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;
    font-size:13px;line-height:1.55;white-space:pre-wrap;word-break:break-word;color:#C8C8E8;position:relative;margin-top:8px}
  .out-label{font-size:10px;color:var(--mut2);text-transform:uppercase;letter-spacing:.5px;margin:10px 0 0;
    display:flex;justify-content:space-between;align-items:center}
  .copybtn{background:var(--pri2);color:#fff;border:none;border-radius:7px;padding:5px 10px;font-size:11px;
    font-weight:700;cursor:pointer}
  .count-ok{color:var(--ok)} .count-bad{color:var(--bad)}
  .statusrow{display:flex;gap:6px;margin-top:12px}
  .statusrow button{flex:1;padding:9px 4px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);
    color:var(--mut);font-size:11px;font-weight:700;cursor:pointer;font-family:inherit}
  .statusrow button.act-listed{border-color:var(--pri);color:var(--pri);background:#5B8CFF18}
  .statusrow button.act-sold{border-color:var(--ok);color:var(--ok);background:#00C85318}

  .summary{background:linear-gradient(135deg,#1A1A2E,#15152A);border:1px solid var(--line);border-radius:14px;
    padding:14px;margin-bottom:14px}
  .summary .st{font-size:17px;font-weight:800;line-height:1.3}
  .summary .sp{font-size:22px;font-weight:900;color:var(--ok);margin-top:4px}
  .summary .ss{font-size:12px;color:var(--mut);margin-top:6px}

  .toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:#1F1F3A;border:1px solid var(--pri);
    color:#fff;padding:11px 18px;border-radius:12px;font-size:13px;font-weight:600;z-index:80;opacity:0;
    transition:opacity .2s,transform .2s;pointer-events:none;white-space:nowrap;box-shadow:0 8px 30px #0008}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px)}

  .modal-bg{position:fixed;inset:0;background:#000a;z-index:90;display:none;align-items:flex-end;justify-content:center}
  .modal-bg.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:520px;
    padding:20px 18px;padding-bottom:max(20px,env(safe-area-inset-bottom))}
  .modal h3{font-size:16px;margin-bottom:8px}
  .modal p{font-size:13px;color:var(--mut);line-height:1.55;margin-bottom:16px}

  .hint{font-size:11px;color:var(--mut2);line-height:1.5;margin-top:6px}
  .banner{background:#16162A;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:12px;
    color:var(--mut);line-height:1.6;margin-bottom:14px}
  .sectitle{font-size:11px;color:var(--mut2);text-transform:uppercase;letter-spacing:.6px;margin:18px 0 8px;font-weight:700}
  .payout{background:#0E1F14;border:1px solid #00C85333;border-radius:9px;padding:8px 11px;font-size:12px;
    color:#9FE0B8;margin-top:8px}
  .payout b{color:var(--ok);font-size:14px}
  .payout span{color:var(--mut);font-weight:500}
  .payout.free{background:#0E1A2A;border-color:#5B8CFF33;color:#A8C4E8}
  .payout.free b{color:var(--pri)}
  .tplrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .tplchip{background:var(--panel);border:1px solid var(--line);color:#A8A8D0;border-radius:999px;
    padding:6px 11px;font-size:12px;font-weight:600;cursor:pointer}
  .tplchip.manage{color:var(--mut);border-style:dashed}
  .tpl-item{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);
    border-radius:10px;padding:10px 12px;margin-bottom:8px}
  .tpl-item .nm{flex:1;font-size:13px;font-weight:600}
  .tpl-item button{background:none;border:none;cursor:pointer;font-size:14px}
  .hidden{display:none!important}
</style>
</head>
<body>
  <div class="header">
    <span class="logo">🏷️</span>
    <div class="grow">
      <div class="h1">CrossList</div>
      <div class="h2" id="hsub">Publicá una vez · vendé en todos lados</div>
    </div>
    <button class="iconbtn" id="btnMenu" title="Menú">⋯</button>
  </div>

  <div class="body" id="app"></div>

  <nav class="nav">
    <button data-tab="list" class="on"><span class="ic">📋</span>Mis artículos</button>
    <button data-tab="new"><span class="ic">➕</span>Nuevo</button>
    <button data-tab="stats"><span class="ic">📊</span>Resumen</button>
  </nav>

  <div class="toast" id="toast"></div>

  <!-- Plantillas de descripción -->
  <div class="modal-bg" id="tplModal">
    <div class="modal">
      <h3>Plantillas de descripción</h3>
      <p>Texto que reusás seguido (envío, devoluciones, cuidado de la prenda…). Tocá una en el editor para insertarla.</p>
      <div id="tplList"></div>
      <label for="tplName" style="margin-top:14px">Nueva plantilla</label>
      <input id="tplName" placeholder="Nombre (ej: Envío)" />
      <textarea id="tplText" placeholder="Texto a insertar…" style="margin-top:8px"></textarea>
      <button class="btn btn-pri" id="tplSave" style="margin-top:10px">＋ Guardar plantilla</button>
      <button class="btn btn-ghost" id="tplClose" style="margin-top:8px">Cerrar</button>
    </div>
  </div>

  <!-- Menú -->
  <div class="modal-bg" id="menuModal">
    <div class="modal">
      <h3>Menú</h3>
      <p>Tus artículos se guardan en este dispositivo. Hacé copias de seguridad seguido.</p>
      <button class="btn btn-sec" id="btnExport" style="margin-bottom:10px">⬇️ Exportar copia (.json)</button>
      <label for="importFile" class="btn btn-sec" style="margin-bottom:10px;cursor:pointer">⬆️ Importar copia</label>
      <input type="file" id="importFile" accept="application/json" class="hidden" />
      <button class="btn btn-ghost" id="btnCloseMenu">Cerrar</button>
    </div>
  </div>

<script>
/* =====================================================================
   CrossList — asistente de publicación cruzada (PWA)
   Cargás el artículo UNA vez; la app genera el contenido optimizado
   para eBay, Poshmark, Mercari, Vinted y Facebook Marketplace, copia
   con un toque, abre cada app y trackea en qué plataforma está / se
   vendió (para que des de baja en el resto). Todo offline, sin claves.
   ===================================================================== */

/* ---------- Definición de marketplaces ----------
   titleMax: límite real de caracteres del título.
   tags: estilo de hashtags que premia cada plataforma.
   url: deep-link a la pantalla "crear publicación".            */
const MARKETS = [
  { id:"ebay",     name:"eBay",                 color:"#E53238", ic:"e",
    titleMax:80, descMax:4000, tags:false,
    url:"https://www.ebay.com/sl/sell" },
  { id:"poshmark", name:"Poshmark",             color:"#822432", ic:"P",
    titleMax:50, descMax:1500, tags:true, maxTags:5,
    url:"https://poshmark.com/create-listing" },
  { id:"mercari",  name:"Mercari",              color:"#5246F6", ic:"M",
    titleMax:80, descMax:1000, tags:true, maxTags:3,
    url:"https://www.mercari.com/sell/" },
  { id:"vinted",   name:"Vinted",               color:"#09B1BA", ic:"V",
    titleMax:70, descMax:2000, tags:true, maxTags:5,
    url:"https://www.vinted.com/items/new" },
  { id:"depop",    name:"Depop",                color:"#FF2300", ic:"D",
    titleMax:65, descMax:1000, tags:true, maxTags:5,
    url:"https://www.depop.com/sell/" },
  { id:"facebook", name:"Facebook Marketplace", color:"#1877F2", ic:"f",
    titleMax:100, descMax:5000, tags:false,
    url:"https://www.facebook.com/marketplace/create/item" },
];
const MARKET_BY = Object.fromEntries(MARKETS.map(m=>[m.id,m]));

/* El valor guardado/publicado es en INGLÉS (en); la etiqueta que ves es en
   español (es). Así la interfaz queda en español pero el cross-listing sale
   100% en inglés, que es el idioma de los compradores en estas plataformas. */
const CONDITIONS = [
  {en:"New with tags",    es:"Nuevo con etiqueta"},
  {en:"New without tags", es:"Nuevo sin etiqueta"},
  {en:"Like new",         es:"Como nuevo"},
  {en:"Very good",        es:"Muy bueno"},
  {en:"Good",             es:"Bueno"},
  {en:"Fair",             es:"Aceptable"},
];
const CATEGORIES = [
  {en:"Women's clothing", es:"Ropa mujer"},
  {en:"Men's clothing",   es:"Ropa hombre"},
  {en:"Shoes",            es:"Calzado"},
  {en:"Bags & purses",    es:"Carteras y bolsos"},
  {en:"Accessories",      es:"Accesorios"},
  {en:"Jewelry",          es:"Joyería"},
  {en:"Beauty",           es:"Belleza"},
  {en:"Electronics",      es:"Electrónica"},
  {en:"Home",             es:"Hogar"},
  {en:"Toys",             es:"Juguetes"},
  {en:"Kids / Baby",      es:"Niños / Bebé"},
  {en:"Sports",           es:"Deportes"},
  {en:"Books",            es:"Libros"},
  {en:"Other",            es:"Otro"},
];
// Mapas para migrar artículos viejos guardados en español → inglés.
const COND_ES2EN=Object.fromEntries(CONDITIONS.map(c=>[c.es,c.en]));
const CAT_ES2EN =Object.fromEntries(CATEGORIES.map(c=>[c.es,c.en]));

/* ===================== Almacenamiento (IndexedDB) ===================== */
const DB_NAME="crosslist-db", STORE="items";
let _db=null;
function db(){
  if(_db) return Promise.resolve(_db);
  return new Promise((res,rej)=>{
    const rq=indexedDB.open(DB_NAME,1);
    rq.onupgradeneeded=()=>{ const d=rq.result;
      if(!d.objectStoreNames.contains(STORE)) d.createObjectStore(STORE,{keyPath:"id"}); };
    rq.onsuccess=()=>{ _db=rq.result; res(_db); };
    rq.onerror=()=>rej(rq.error);
  });
}
function tx(mode){ return db().then(d=>d.transaction(STORE,mode).objectStore(STORE)); }
async function dbAll(){ const s=await tx("readonly");
  return new Promise((res,rej)=>{ const r=s.getAll(); r.onsuccess=()=>res(r.result||[]); r.onerror=()=>rej(r.error); }); }
async function dbGet(id){ const s=await tx("readonly");
  return new Promise((res,rej)=>{ const r=s.get(id); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function dbPut(it){ const s=await tx("readwrite");
  return new Promise((res,rej)=>{ const r=s.put(it); r.onsuccess=()=>res(); r.onerror=()=>rej(r.error); }); }
async function dbDel(id){ const s=await tx("readwrite");
  return new Promise((res,rej)=>{ const r=s.delete(id); r.onsuccess=()=>res(); r.onerror=()=>rej(r.error); }); }

/* ===================== Utilidades ===================== */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),1600); }
function money(n){ const v=parseFloat(n); return isNaN(v)?"—":"$"+v.toFixed(2); }

/* Completa campos nuevos (Depop, medidas, fecha de publicación) en artículos
   viejos sin romperlos. */
function ensure(it){ if(!it) return it; if(!it.status) it.status={};
  for(const m of MARKETS) if(!(m.id in it.status)) it.status[m.id]="none";
  if(it.measurements==null) it.measurements="";
  if(it.listedAt===undefined){ const anyLive=MARKETS.some(m=>it.status[m.id]==="listed");
    it.listedAt=anyLive?(it.createdAt||Date.now()):null; }
  // Migrar estado/categoría guardados en español a inglés.
  if(it.condition && COND_ES2EN[it.condition]) it.condition=COND_ES2EN[it.condition];
  if(it.category  && CAT_ES2EN[it.category])   it.category =CAT_ES2EN[it.category];
  return it; }

/* Días desde un timestamp (para el recordatorio de bajar precio). */
const STALE_DAYS=7;
function daysSince(ts){ return ts?Math.floor((Date.now()-ts)/86400000):0; }

/* ===================== Comisiones y ganancia estimada por plataforma =====================
   Valores aproximados (cambian por país/promos). Sirven para comparar, no son exactos.
   - eBay: ~13% + $0.30   - Poshmark: $2.95 fijo si <$15, si no 20%
   - Mercari: 10% + proc. ~2.9%+$0.50   - Depop: solo proc. ~3.3%+$0.45 (sin fee de venta US)
   - Vinted: 0 (lo paga el comprador)   - Facebook: 0 en persona (efectivo)                */
function estFee(price,m){
  const p=parseFloat(price)||0; if(!p) return 0;
  switch(m.id){
    case "ebay":     return p*0.13+0.30;
    case "poshmark": return p<15?2.95:p*0.20;
    case "mercari":  return p*0.10+(p*0.029+0.50);
    case "depop":    return p*0.033+0.45;
    case "vinted":   return 0;
    case "facebook": return 0;
    default:         return 0;
  }
}
function payout(price,m){ const p=parseFloat(price)||0; return Math.max(0,p-estFee(p,m)); }

/* dataURL → File, para poder compartir las fotos al selector del sistema. */
function dataURLtoFile(d,name){ const [h,b]=d.split(","); const mime=(h.match(/:(.*?);/)||[])[1]||"image/jpeg";
  const bin=atob(b); const u=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return new File([u],name,{type:mime}); }

/* ===================== Plantillas de descripción (localStorage) ===================== */
const TPL_KEY="crosslist-templates";
function getTpls(){ try{ return JSON.parse(localStorage.getItem(TPL_KEY))||[]; }catch(_){ return []; } }
function saveTpls(a){ localStorage.setItem(TPL_KEY,JSON.stringify(a)); }
function renderTplRow(){ const r=$("#tplRow"); if(!r) return; const tpls=getTpls();
  r.innerHTML=tpls.map(t=>`<span class="tplchip" onclick="insertTpl('${t.id}')">＋ ${esc(t.name)}</span>`).join("")
    +`<span class="tplchip manage" onclick="openTplModal()">⚙️ Plantillas</span>`; }
window.insertTpl=id=>{ const t=getTpls().find(x=>x.id===id); if(!t) return; const ta=$("#f_desc"); if(!ta) return;
  ta.value=(ta.value.trim()?ta.value.trim()+"\n":"")+t.text; ta.focus(); toast("Plantilla insertada"); };
function openTplModal(){ renderTplList(); $("#tplModal").classList.add("show"); }
window.openTplModal=openTplModal;
function renderTplList(){ const tpls=getTpls(); const el=$("#tplList"); if(!el) return;
  el.innerHTML=tpls.length?tpls.map(t=>`<div class="tpl-item"><span class="nm">${esc(t.name)}</span>
    <button onclick="delTpl('${t.id}')" style="color:var(--bad)">🗑️</button></div>`).join("")
    :`<div class="hint">Todavía no tenés plantillas. Creá una abajo 👇</div>`; }

/* Comprime una imagen a JPEG ~1000px para no llenar el almacenamiento. */
function compress(file){
  return new Promise((res)=>{
    const img=new Image();
    img.onload=()=>{
      const max=1000, sc=Math.min(1,max/Math.max(img.width,img.height));
      const w=Math.round(img.width*sc), h=Math.round(img.height*sc);
      const c=document.createElement("canvas"); c.width=w; c.height=h;
      c.getContext("2d").drawImage(img,0,0,w,h);
      res(c.toDataURL("image/jpeg",0.72));
    };
    img.onerror=()=>res(null);
    img.src=URL.createObjectURL(file);
  });
}

/* ===================== Generación de contenido por marketplace ===================== */
function clip(s,max){ s=(s||"").trim(); return s.length<=max?s:s.slice(0,max-1).trim()+"…"; }

/* Hashtags a partir de marca / categoría / color / talle. */
function buildTags(it,max){
  const words=[];
  const push=v=>{ if(!v) return; v.split(/[\s/]+/).forEach(w=>{ w=w.replace(/[^A-Za-zÁÉÍÓÚÜÑáéíóúüñ0-9]/g,""); if(w.length>2) words.push(w); }); };
  push(it.brand); push(it.category); push(it.color); if(it.size) words.push("Size"+it.size.replace(/\s/g,""));
  (it.keywords||"").split(",").forEach(k=>push(k));
  const seen=new Set(), tags=[];
  for(const w of words){ const t="#"+w.charAt(0).toUpperCase()+w.slice(1); const k=t.toLowerCase();
    if(!seen.has(k)){ seen.add(k); tags.push(t); } if(tags.length>=max) break; }
  return tags;
}

/* Título óptimo: marca + título + atributos clave, recortado al límite. */
function buildTitle(it,m){
  const parts=[it.brand,it.title,it.size&&("Size "+it.size),it.color].filter(Boolean);
  let t=parts.join(" ").replace(/\s+/g," ").trim();
  if(!t) t=it.title||"Artículo";
  return clip(t,m.titleMax);
}

function buildDesc(it,m){
  const L=[];
  if(it.description) L.push(it.description.trim());
  const specs=[];
  if(it.brand) specs.push("Brand: "+it.brand);
  if(it.size) specs.push("Size: "+it.size);
  if(it.color) specs.push("Color: "+it.color);
  if(it.condition) specs.push("Condition: "+it.condition);
  if(it.category) specs.push("Category: "+it.category);
  if(specs.length) L.push((it.description?"\n":"")+specs.join("\n"));
  if(it.measurements) L.push("\nMeasurements:\n"+it.measurements.trim());
  if(m.tags){ const tags=buildTags(it,m.maxTags||3); if(tags.length) L.push("\n"+tags.join(" ")); }
  return clip(L.join("\n").trim(),m.descMax);
}

    title:(src.title||"Artículo")+" (copia)",

  await dbPut(copy); toast("Duplicado ✓");
  CURRENT=copy.id; EDIT=copy; TAB="new"; renderEditor(); $("#hsub").textContent="Editar copia";
}

function copyText(elId){
  const txt=$("#"+elId).textContent;
  const done=()=>toast("Copiado ✓");
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(done,()=>fallbackCopy(txt,done)); }
  else fallbackCopy(txt,done);
}
function fallbackCopy(txt,cb){ const ta=document.createElement("textarea"); ta.value=txt;
  ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); cb(); }catch(e){} document.body.removeChild(ta); }
window.copyText=copyText;

async function setStatus(id,st){

  if(st==="listed" && !EDIT.listedAt) EDIT.listedAt=Date.now();
  await dbPut(EDIT);
  // si marcás VENDIDO y hay otras activas → recordatorio para dar de baja
  if(st==="sold"){
    const others=MARKETS.filter(m=>m.id!==id && EDIT.status[m.id]==="listed");
    if(others.length){
      if(confirm(`✓ Vendido en ${MARKET_BY[id].name}.\n\n¿Marcar como dado de baja en ${others.map(m=>m.name).join(", ")}?\n(Acordate de borrar la publicación en esas apps para no vender dos veces.)`)){

  openItem(id);
}

  const soldItems=items.filter(it=>MARKETS.some(m=>it.status[m.id]==="sold"));
  const revenue=soldItems.reduce((s,it)=>s+(parseFloat(it.price)||0),0);
  const perMarket=MARKETS.map(m=>({m,
    listed:items.filter(it=>it.status[m.id]==="listed").length,
    sold:items.filter(it=>it.status[m.id]==="sold").length}));
  const app=$("#app");
  app.innerHTML=`
    <div class="grid2" style="margin-bottom:10px">
      <div class="summary" style="margin:0"><div class="ss">Artículos</div><div class="sp" style="color:var(--txt)">${items.length}</div></div>
      <div class="summary" style="margin:0"><div class="ss">Activos</div><div class="sp" style="color:var(--pri)">${live}</div></div>
    </div>
    <div class="grid2" style="margin-bottom:14px">
      <div class="summary" style="margin:0"><div class="ss">Vendidos</div><div class="sp">${soldItems.length}</div></div>
      <div class="summary" style="margin:0"><div class="ss">Ingresos</div><div class="sp">${money(revenue)}</div></div>
    </div>
    <div class="sectitle">Por marketplace</div>
    ${perMarket.map(({m,listed,sold})=>`
      <div class="mk"><div class="mk-head" style="cursor:default">
        <div class="mk-ic" style="background:${m.color}">${m.ic}</div>
        <div class="mk-name">${m.name}</div>
        <div class="mk-meta">● ${listed} activos &nbsp; ✓ ${sold} vendidos</div>
      </div></div>`).join("")}
    <div class="banner" style="margin-top:16px">💡 <b>Tip:</b> cuando algo se vende, marcalo como <b>Vendido</b> en su tarjeta. La app te recuerda dar de baja la publicación en las otras plataformas para que no lo vendas dos veces.</div>`;
}

/* ===================== Menú: export / import ===================== */
$("#btnMenu").addEventListener("click",()=>$("#menuModal").classList.add("show"));
$("#btnCloseMenu").addEventListener("click",()=>$("#menuModal").classList.remove("show"));
$("#menuModal").addEventListener("click",e=>{ if(e.target.id==="menuModal") e.target.classList.remove("show"); });

// Plantillas
$("#tplSave").addEventListener("click",()=>{
  const n=$("#tplName").value.trim(), tx=$("#tplText").value.trim();
  if(!n||!tx){ toast("Completá nombre y texto"); return; }
  const a=getTpls(); a.push({id:uid(),name:n,text:tx}); saveTpls(a);
  $("#tplName").value=""; $("#tplText").value="";
  renderTplList(); renderTplRow(); toast("Plantilla guardada ✓");
});
$("#tplClose").addEventListener("click",()=>$("#tplModal").classList.remove("show"));
$("#tplModal").addEventListener("click",e=>{ if(e.target.id==="tplModal") e.target.classList.remove("show"); });
$("#btnExport").addEventListener("click",async()=>{
  const items=await dbAll();
  const blob=new Blob([JSON.stringify({app:"crosslist",version:1,exportedAt:Date.now(),items},null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="crosslist-backup-"+new Date().toISOString().slice(0,10)+".json"; a.click();
  URL.revokeObjectURL(a.href); toast("Copia exportada ✓");
});
$("#importFile").addEventListener("change",async e=>{
  const f=e.target.files[0]; if(!f) return;
  try{
    const data=JSON.parse(await f.text());
    const items=Array.isArray(data)?data:data.items;
    if(!Array.isArray(items)) throw 0;
    let n=0;
    for(const it of items){ if(it&&it.id){ it.status=it.status||Object.fromEntries(MARKETS.map(m=>[m.id,"none"])); await dbPut(it); n++; } }
    toast("Importados "+n+" artículo(s)"); $("#menuModal").classList.remove("show"); setTab("list");
  }catch(_){ toast("Archivo inválido"); }
  e.target.value="";
});

/* ===================== Service worker (offline / instalable) ===================== */
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}

/* ===================== Arranque ===================== */
setTab("list");
</script>
</body>
</html>
